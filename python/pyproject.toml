[project]
name = "apiverve-cryptogramgenerator"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Cryptogram Generator creates letter substitution cipher puzzles where each letter is replaced with another letter consistently throughout the text."
keywords = ["cryptogram", "cipher", "code puzzle", "substitution cipher", "decode"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/cryptogram?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/cryptogram?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/cryptogram-api"
Twitter = "https://twitter.com/apivervehq"
